<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Toko Kanda - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-wrapper {
            min-height: calc(100vh - 56px);
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Sistem Kasir Toko Kanda</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="transaksi.html">🛒 Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link" href="update_barang.html">📦 Update Barang</a></li>
                </ul>
                
                <div class="navbar-nav align-items-center" id="menu-auth">
                    <div id="tampilan-tamu" class="d-flex align-items-center">
                        <a href="#" class="nav-link fw-bold text-light px-2" onclick="simulasiLogin(event)">Masuk</a>
                        <span class="text-muted mx-1">/</span>
                        <a href="registrasi.html" class="nav-link fw-bold text-light px-2">Daftar</a>
                    </div>
                    <div id="tampilan-kasir" class="d-flex align-items-center d-none">
                        <span class="nav-link text-light me-2">Kasir: <strong class="text-warning" id="nama-kasir">Toko Kanda</strong></span>
                        <a href="#" class="btn btn-danger btn-sm fw-bold px-3" onclick="simulasiLogout(event)">Logout</a>
                    </div>
                </div>

            </div>
        </div>
    </nav>

    <div class="container hero-wrapper d-flex align-items-center justify-content-center">
        <div class="w-100" style="max-width: 900px;">
            <div class="card shadow-sm border-0 bg-white p-5 text-center rounded-3">
                
                <h1 class="display-5 fw-bold text-dark mb-3">Selamat Datang di Website Kasir</h1>
                
                <p class="text-muted fs-5 mb-5 mx-auto" style="max-width: 700px;">
                Silakan pilih tombol di bawah untuk memulai aktivitas tokomu.
                </p>
                
                <div class="d-flex flex-row justify-content-center gap-3">
                    <a href="transaksi.html" class="btn btn-primary btn-lg px-4 fw-bold shadow-sm py-2 fs-6">Mulai Transaksi</a>
                    <a href="update_barang.html" class="btn btn-outline-secondary btn-lg px-4 fw-medium py-2 fs-6">Kelola Stok Barang</a>
                </div>

            </div>
        </div>
    </div>

    <script>
        function simulasiLogin(event) {
            event.preventDefault(); 
            let nama = prompt("Masukkan nama Kasir untuk simulasi:", "Kanda Admin");
            
            if (nama) {
                document.getElementById('nama-kasir').innerText = nama; 
                document.getElementById('tampilan-tamu').classList.add('d-none');
                document.getElementById('tampilan-kasir').classList.remove('d-none'); 
                
                localStorage.setItem('session_kasir', nama);
            }
        }

        function simulasiLogout(event) {
            event.preventDefault();
            document.getElementById('tampilan-tamu').classList.remove('d-none');
            document.getElementById('tampilan-kasir').classList.add('d-none');
            
            localStorage.removeItem('session_kasir');
        }

        document.addEventListener("DOMContentLoaded", function() {
            let kasirTersimpan = localStorage.getItem('session_kasir');
            if (kasirTersimpan) {
                document.getElementById('nama-kasir').innerText = kasirTersimpan;
                document.getElementById('tampilan-tamu').classList.add('d-none');
                document.getElementById('tampilan-kasir').classList.remove('d-none');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
