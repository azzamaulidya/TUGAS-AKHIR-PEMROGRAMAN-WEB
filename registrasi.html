<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Registrasi Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center fw-bold py-3">DAFTAR ADMIN BARU</div>
                    <div class="card-body p-4">
                        <form onsubmit="alert('Akun Terdaftar (Simulasi)! Silakan login.'); window.location='login.html'; event.preventDefault();">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Buat Username</label>
                                <input type="text" class="form-control" placeholder="Ketik nama pengguna" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Buat Password</label>
                                <input type="password" class="form-control" placeholder="Minimal 6 karakter" minlength="6" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Ulangi Password</label>
                                <input type="password" class="form-control" placeholder="Ketik ulang password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Daftar Akun ➔</button>
                        </form>
                        <div class="text-center mt-3"><span class="text-muted">Sudah punya akun?</span> <a href="login.html" class="text-decoration-none fw-bold text-primary">Masuk</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
