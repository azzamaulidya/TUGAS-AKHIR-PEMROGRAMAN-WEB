<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Registrasi Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center fw-bold py-3">DAFTAR KASIR BARU</div>
                    <div class="card-body p-4">

                        <div id="alertBox" class="alert d-none mb-3"></div>

                        <form id="formRegistrasi">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Buat Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Ketik nama pengguna" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Buat Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Minimal 6 karakter" minlength="6" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Ulangi Password</label>
                                <input type="password" name="konfirmasi_password" class="form-control" placeholder="Ketik ulang password" required>
                            </div>
                            <button type="submit" id="btnDaftar" class="btn btn-primary w-100 fw-bold py-2">Daftar Akun ➔</button>
                        </form>

                        <div class="text-center mt-3">
                            <span class="text-muted">Sudah punya akun?</span>
                            <a href="login.html" class="text-decoration-none fw-bold text-primary">Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    document.getElementById('formRegistrasi').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn        = document.getElementById('btnDaftar');
        const password   = this.password.value;
        const konfirmasi = this.konfirmasi_password.value;

        if (password !== konfirmasi) { showAlert('Password dan konfirmasi tidak cocok!', 'danger'); return; }
        if (password.length < 6)     { showAlert('Password minimal 6 karakter.', 'danger'); return; }

        const data = {
            username:            this.username.value.trim(),
            password:            password,
            konfirmasi_password: konfirmasi
        };

        btn.disabled    = true;
        btn.textContent = 'Mendaftarkan...';

        try {
            const res  = await fetch('auth.php?action=registrasi', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(data)
            });
            const json = await res.json();

            if (json.status === 'success') {
                showAlert('Registrasi berhasil! Mengarahkan ke login...', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                showAlert(json.message || 'Registrasi gagal.', 'danger');
                btn.disabled    = false;
                btn.textContent = 'Daftar Akun ➔';
            }
        } catch (err) {
            showAlert('Tidak dapat terhubung ke server.', 'danger');
            btn.disabled    = false;
            btn.textContent = 'Daftar Akun ➔';
        }
    });

    function showAlert(msg, type) {
        const el = document.getElementById('alertBox');
        el.className   = `alert alert-${type} mb-3`;
        el.textContent = msg;
    }
</script>
</body>
</html>
