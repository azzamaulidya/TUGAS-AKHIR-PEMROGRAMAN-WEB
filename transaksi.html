<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Toko Kanda - Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Sistem Kasir Toko Kanda</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="transaksi.html">🛒 Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link" href="update_barang.html">📦 Update Barang</a></li>
                </ul>
                
                <div class="navbar-nav align-items-center" id="menu-auth">
                    <div id="tampilan-tamu" class="d-flex align-items-center">
                        <a href="#" class="nav-link fw-bold text-light px-2" onclick="simulasiLogin(event)">Masuk</a>
                        <span class="text-muted mx-1">/</span>
                        <a href="registrasi.html" class="nav-link fw-bold text-light px-2">Daftar</a>
                    </div>
                    <div id="tampilan-kasir" class="d-flex align-items-center d-none">
                        <span class="nav-link text-light me-2">Kasir: <strong class="text-warning" id="nama-kasir">Toko Kanda</strong></span>
                        <a href="#" class="btn btn-danger btn-sm fw-bold px-3" onclick="simulasiLogout(event)">Keluar</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold py-3">Masukkan Barang Belanjaan</div>
                    <div class="card-body p-4">
                        <form id="formBelanja" onsubmit="tambahBarangKeTabel(event)">
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Nama Barang</label>
                                <input type="text" class="form-control" id="namaBarang" placeholder="Ketik nama barang..." oninput="pilihBarangOtomatis()" list="dataBarangToko" required>
                                <datalist id="dataBarangToko">
                                    <option value="Sabun Mandi">
                                    <option value="Mie Instan">
                                    <option value="Susu Kotak">
                                </datalist>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">ID Barang</label>
                                <input type="text" class="form-control bg-light" id="idBarang" placeholder="Otomatis..." readonly>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Harga (Rp)</label>
                                <input type="number" class="form-control bg-light" id="hargaBarang" placeholder="Otomatis..." readonly>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Jumlah / Qty</label>
                                <input type="number" class="form-control" id="qtyBarang" value="1" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Kirim ke Subtotal ➔</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8 p-4 rounded bg-white shadow-sm" style="border-left: 3px dashed #dee2e6; min-height: 75vh;">
                <h4 class="fw-bold mb-3 text-dark">Subtotal Belanja</h4>
                <div class="table-responsive mb-4">
                    <table class="table table-hover align-middle text-center w-100">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>ID Barang</th>
                                <th>Nama Barang</th>
                                <th>Harga</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelSubtotal">
                            <tr><td colspan="7" class="text-muted">Belum ada barang belanjaan...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="mb-3 shadow-sm text-end p-3 rounded fw-bold" style="background-color: #1e2229; color: #ffc107; font-size: 2.2rem; font-family: 'Courier New', monospace;">
                    TOTAL BELANJA: <span id="totalAkhir">Rp 0</span>
                </div>
                <button class="btn btn-primary btn-lg w-100 fw-bold shadow" onclick="alert('Simulasi Transaksi Selesai & Struk Dicetak!')">SELESAI & CETAK STRUK</button>
            </div>

        </div>
    </div>

    <script>
        // Array Data Master Barang Tiruan
        const produkToko = [
            { id: "BRG001", nama: "Sabun Mandi", harga: 4500 },
            { id: "BRG002", nama: "Mie Instan", harga: 3000 },
            { id: "BRG003", nama: "Susu Kotak", harga: 6000 }
        ];

        let keranjang = [];

        function pilihBarangOtomatis() {
            let inputNama = document.getElementById('namaBarang').value;
            let produk = produkToko.find(p => p.nama.toLowerCase() === inputNama.toLowerCase());
            
            if(produk) {
                document.getElementById('idBarang').value = produk.id;
                document.getElementById('hargaBarang').value = produk.harga;
            } else {
                document.getElementById('idBarang').value = '';
                document.getElementById('hargaBarang').value = '';
            }
        }

        function tambahBarangKeTabel(event) {
            event.preventDefault();
            let id = document.getElementById('idBarang').value;
            let nama = document.getElementById('namaBarang').value;
            let harga = parseInt(document.getElementById('hargaBarang').value);
            let qty = parseInt(document.getElementById('qtyBarang').value);

            if(!id) { alert("Pilih produk dari daftar pilihan yang tersedia!"); return; }

            keranjang.push({ id, nama, harga, qty, subtotal: harga * qty });
            document.getElementById('formBelanja').reset();
            document.getElementById('qtyBarang').value = 1;
            renderTabelKeranjang();
        }

        function renderTabelKeranjang() {
            let tbody = document.getElementById('tabelSubtotal');
            let totalBox = document.getElementById('totalAkhir');
            tbody.innerHTML = '';
            let totalSemua = 0;

            if(keranjang.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-muted">Belum ada barang belanjaan...</td></tr>';
                totalBox.innerText = "Rp 0";
                return;
            }

            keranjang.forEach((item, index) => {
                totalSemua += item.subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="fw-bold text-secondary">${item.id}</td>
                        <td class="text-start fw-bold">${item.nama}</td>
                        <td>Rp ${item.harga.toLocaleString('id-ID')}</td>
                        <td>${item.qty} Pcs</td>
                        <td class="text-primary fw-bold">Rp ${item.subtotal.toLocaleString('id-ID')}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="hapusItemKeranjang(${index})">Hapus</button></td>
                    </tr>`;
            });
            totalBox.innerText = "Rp " + totalSemua.toLocaleString('id-ID');
        }

        function hapusItemKeranjang(index) {
            keranjang.splice(index, 1);
            renderTabelKeranjang();
        }

        function simulasiLogin(event) {
            event.preventDefault();
            let nama = prompt("Masukkan nama Kasir untuk simulasi:", "Kanda Admin");
            if (nama) {
                document.getElementById('nama-kasir').innerText = nama;
                document.getElementById('tampilan-tamu').classList.add('d-none');
                document.getElementById('tampilan-kasir').classList.remove('d-none');
                localStorage.setItem('session_kasir', nama);
            }
        }

        function simulasiLogout(event) {
            event.preventDefault();
            document.getElementById('tampilan-tamu').classList.remove('d-none');
            document.getElementById('tampilan-kasir').classList.add('d-none');
            localStorage.removeItem('session_kasir');
        }

        document.addEventListener("DOMContentLoaded", function() {
            let kasirTersimpan = localStorage.getItem('session_kasir');
            if (kasirTersimpan) {
                document.getElementById('nama-kasir').innerText = kasirTersimpan;
                document.getElementById('tampilan-tamu').classList.add('d-none');
                document.getElementById('tampilan-kasir').classList.remove('d-none');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
