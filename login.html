<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center fw-bold py-3">MASUK</div>
                    <div class="card-body p-4">
                        <form onsubmit="alert('Simulasi Login Berhasil!'); window.location='index.html'; event.preventDefault();">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Masuk ➔</button>
                        </form>
                        <div class="text-center mt-3"><span class="text-muted">Belum punya akun?</span> <a href="registrasi.html" class="text-decoration-none fw-bold text-primary">Daftar</a></div>
                        <hr>
                        <div class="text-center"><a href="index.html" class="text-decoration-none text-secondary">➔ Kembali ke Dashboard</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
