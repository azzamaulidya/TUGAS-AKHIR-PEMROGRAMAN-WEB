<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center fw-bold py-3">LOGIN SISTEM</div>
                    <div class="card-body p-4">

                        <div id="alertBox" class="alert d-none mb-3"></div>

                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" name="username" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" name="password" placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" id="btnLogin" class="btn btn-primary w-100 fw-bold py-2">Masuk</button>
                        </form>

                        <div class="text-center mt-3">
                            <span class="text-muted">Belum punya akun?</span>
                            <a href="registrasi.html" class="text-decoration-none fw-bold text-primary">Registrasi</a>
                        </div>
                        <hr>
                        <div class="text-center">
                            <a href="index.html" class="text-decoration-none text-secondary">➔ Kembali ke Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn  = document.getElementById('btnLogin');
        const data = {
            username: this.username.value.trim(),
            password: this.password.value.trim()
        };

        btn.disabled    = true;
        btn.textContent = 'Memproses...';

        try {
            const res  = await fetch('auth.php?action=login', {
                method:      'POST',
                headers:     { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body:        JSON.stringify(data)
            });
            const json = await res.json();

            if (json.status === 'success') {
                showAlert('Login berhasil! Mengalihkan...', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } else {
                showAlert(json.message || 'Login gagal.', 'danger');
                btn.disabled    = false;
                btn.textContent = 'Masuk';
            }
        } catch (err) {
            showAlert('Tidak dapat terhubung ke server.', 'danger');
            btn.disabled    = false;
            btn.textContent = 'Masuk';
        }
    });

    function showAlert(msg, type) {
        const el = document.getElementById('alertBox');
        el.className   = `alert alert-${type} mb-3`;
        el.textContent = msg;
    }
</script>
</body>
</html>
