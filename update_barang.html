<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Kelola Barang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Sistem Kasir Toko Berkah Abadi</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="transaksi.html">🛒 Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link active" href="update_barang.html">📦 Update Barang</a></li>
                </ul>
                <div class="navbar-nav align-items-center">
                    <a href="login.html" class="nav-link fw-bold text-light px-2">Login</a>
                    <span class="text-muted mx-1">/</span>
                    <a href="registrasi.html" class="nav-link fw-bold text-light px-2">Registrasi</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold py-3">Tambah Produk Baru</div>
                    <div class="card-body p-4">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">ID Barang (Kode)</label><input type="text" class="form-control" name="id" required></div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama Barang</label><input type="text" class="form-control" name="nama" required></div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Harga Jual (Rp)</label><input type="number" class="form-control" name="harga" required></div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Stok Jumlah Masuk</label><input type="number" class="form-control" name="stok" min="0" required></div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Simpan ke Sistem Toko</button>
                        </form>
                    </div>
                </div>

                </div>

            <div class="col-md-8 p-4 rounded bg-white shadow-sm" style="border-left: 3px dashed #dee2e6; min-height: 75vh;">
                <h4 class="fw-bold mb-4 text-dark ms-2">Daftar Produk</h4>
                <div class="table-responsive">
                    <table class="table table-striped align-middle text-center w-100">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>ID Barang</th>
                                <th>Nama Barang</th>
                                <th>Harga Barang</th>
                                <th>Stok Barang</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td class="fw-bold text-secondary">BRG001</td>
                                <td class="fw-bold text-start">Sabun Mandi</td>
                                <td class="fw-bold">Rp 4.500</td>
                                <td class="fw-bold text-info">50 Pcs</td>
                                <td>
                                    <button class="btn btn-warning btn-sm fw-bold text-dark" onclick="uiBukaModalEdit('BRG001', 'Sabun Mandi', 4500, 50)">Edit</button> 
                                    <a href="#" class="btn btn-danger btn-sm fw-bold">Hapus</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalEditMaster" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold">Edit Detail Produk & Stok</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            
            <form>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">ID Barang</label>
                        <input type="text" class="form-control bg-light" id="uiEditID" name="id" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Barang</label>
                        <input type="text" class="form-control" id="uiEditNama" name="nama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Harga Baru (Rp)</label>
                        <input type="number" class="form-control" id="uiEditHarga" name="harga" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-primary">Stok Gudang Sekarang</label>
                        <input type="number" class="form-control" id="uiEditStok" name="stok" min="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-warning fw-bold text-dark">Simpan Perubahan</button>
                </div>
            </form>  
        </div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalEdit;

        document.addEventListener('DOMContentLoaded', async () => {
            modalEdit = new bootstrap.Modal(document.getElementById('modalEditMaster'));
            await cekSession();
            await muatBarang();
        });

        // Cek session
        async function cekSession() {
            try {
                const res  = await fetch('auth.php?action=cek_session', { credentials: 'same-origin' });
                const json = await res.json();
                if (json.status === 'success') {
                    document.getElementById('infoUser').textContent = `👤 ${json.data.nama_user} (${json.data.nama_level})`;
                } else {
                    window.location.href = 'login.html';
                }
            } catch { window.location.href = 'login.html'; }
        }

        // Logout
        document.getElementById('btnLogout').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('auth.php?action=logout', { credentials: 'same-origin' });
            window.location.href = 'login.html';
        });

        // Muat tabel barang
        async function muatBarang() {
            const tbody = document.getElementById('tabelBarang');
            try {
                const res    = await fetch('barang.php', { credentials: 'same-origin' });
                const json   = await res.json();
                const barangs = json.data ?? [];

                if (barangs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-muted py-4">Belum ada data barang.</td></tr>';
                    return;
                }

                tbody.innerHTML = barangs.map((b, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="fw-bold text-secondary">${esc(b.kode_barang ?? '-')}</td>
                        <td class="fw-bold text-start">${esc(b.nama_barang)}</td>
                        <td class="fw-bold">${formatRupiah(b.harga)}</td>
                        <td class="fw-bold ${b.stok < 5 ? 'text-danger' : 'text-info'}">${b.stok} Pcs</td>
                        <td>
                            <button class="btn btn-warning btn-sm fw-bold text-dark me-1"
                                onclick="bukaModalEdit(${b.id_barang}, '${esc(b.kode_barang)}', '${esc(b.nama_barang)}', ${b.harga}, ${b.stok})">
                                Edit
                            </button>
                            <button class="btn btn-danger btn-sm fw-bold"
                                onclick="hapusBarang(${b.id_barang}, '${esc(b.nama_barang)}')">
                                Hapus
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch {
                tbody.innerHTML = '<tr><td colspan="6" class="text-danger">Gagal memuat data.</td></tr>';
            }
        }

        // Tambah barang
        document.getElementById('formTambah').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn  = document.getElementById('btnTambah');
            const data = {
                id:    this.id.value.trim(),
                nama:  this.nama.value.trim(),
                harga: parseInt(this.harga.value),
                stok:  parseInt(this.stok.value)
            };

            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            try {
                const res  = await fetch('barang.php', {
                    method:      'POST',
                    headers:     { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body:        JSON.stringify(data)
                });
                const json = await res.json();

                if (json.status === 'success') {
                    showAlert('Barang berhasil ditambahkan!', 'success');
                    this.reset();
                    await muatBarang();
                } else {
                    showAlert(json.message, 'danger');
                }
            } catch {
                showAlert('Gagal terhubung ke server.', 'danger');
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Simpan ke Sistem Toko';
            }
        });

        // Buka modal edit
        function bukaModalEdit(pk, kode, nama, harga, stok) {
            document.getElementById('uiEditPK').value    = pk;
            document.getElementById('uiEditID').value    = kode;
            document.getElementById('uiEditNama').value  = nama;
            document.getElementById('uiEditHarga').value = harga;
            document.getElementById('uiEditStok').value  = stok;
            modalEdit.show();
        }

        // Simpan edit
        document.getElementById('formEdit').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pk   = document.getElementById('uiEditPK').value;
            const data = {
                nama:  document.getElementById('uiEditNama').value.trim(),
                harga: parseInt(document.getElementById('uiEditHarga').value),
                stok:  parseInt(document.getElementById('uiEditStok').value)
            };

            try {
                const res  = await fetch(`barang.php?id=${pk}`, {
                    method:      'PUT',
                    headers:     { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body:        JSON.stringify(data)
                });
                const json = await res.json();

                if (json.status === 'success') {
                    modalEdit.hide();
                    showAlert('Barang berhasil diperbarui!', 'success');
                    await muatBarang();
                } else {
                    showAlert(json.message, 'danger');
                }
            } catch {
                showAlert('Gagal terhubung ke server.', 'danger');
            }
        });

        // Hapus barang
        async function hapusBarang(id, nama) {
            if (!confirm(`Yakin ingin menghapus barang "${nama}"?`)) return;
            try {
                const res  = await fetch(`barang.php?id=${id}`, {
                    method:      'DELETE',
                    credentials: 'same-origin'
                });
                const json = await res.json();
                if (json.status === 'success') {
                    showAlert('Barang berhasil dihapus.', 'success');
                    await muatBarang();
                } else {
                    showAlert(json.message, 'danger');
                }
            } catch {
                showAlert('Gagal terhubung ke server.', 'danger');
            }
        }

        function formatRupiah(n) { return 'Rp ' + parseInt(n).toLocaleString('id-ID'); }
        function esc(str) { return String(str ?? '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
        function showAlert(msg, type) {
            const el = document.getElementById('alertGlobal');
            el.className   = `alert alert-${type} mb-3`;
            el.textContent = msg;
            setTimeout(() => { el.className = 'alert d-none'; }, 4000);
        }
    </script>
</body>
</html>
