<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Kelola Barang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Sistem Kasir Toko Berkah Abadi</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="transaksi.html">🛒 Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link active" href="update_barang.html">📦 Update Barang</a></li>
                </ul>
                <div class="navbar-nav align-items-center">
                    <span id="infoUser" class="text-light me-3"></span>
                    <a href="#" id="btnLogout" class="nav-link fw-bold text-warning px-2">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div id="alertGlobal" class="alert d-none"></div>
    </div>

    <div class="container-fluid px-4 mb-5">
        <div class="row">
            
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold py-3">Tambah Produk Baru</div>
                    <div class="card-body p-4">
                        <form id="formTambah" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">ID Barang (Kode)</label>
                                <input type="text" class="form-control" name="id" placeholder="Contoh: BRG001" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama Barang</label>
                                <input type="text" class="form-control" name="nama" placeholder="Nama produk..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Harga Jual (Rp)</label>
                                <input type="number" class="form-control" name="harga" placeholder="Harga satuan..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Stok Jumlah Masuk</label>
                                <input type="number" class="form-control" name="stok" min="0" placeholder="Jumlah stok..." required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Gambar/Foto Produk</label>
                                <input type="file" class="form-control" name="gambar" accept="image/*">
                                <small class="text-muted d-block mt-1">Format: JPG, JPEG, PNG. Maksimal 2MB.</small>
                            </div>
                            <button type="submit" id="btnTambah" class="btn btn-primary w-100 fw-bold py-2">Simpan ke Sistem Toko</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8 p-4 rounded bg-white shadow-sm" style="border-left: 3px dashed #dee2e6; min-height: 75vh;">
                <h4 class="fw-bold mb-4 text-dark ms-2">Daftar Produk</h4>
                <div class="table-responsive">
                    <table class="table table-striped align-middle text-center w-100">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>ID Barang</th>
                                <th>Gambar</th> <th>Nama Barang</th>
                                <th>Harga Barang</th>
                                <th>Stok Barang</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelBarang">
                            <tr><td colspan="7" class="text-muted py-4">Data sedang dimuat via server...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalEditMaster" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold text-dark">Edit Detail Produk & Stok</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formEdit" enctype="multipart/form-data">
                    <div class="modal-body">
                        <input type="hidden" id="uiEditPK">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">ID Barang</label>
                            <input type="text" class="form-control bg-light" id="uiEditID" name="id" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama Barang</label>
                            <input type="text" class="form-control" id="uiEditNama" name="nama" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Harga Baru (Rp)</label>
                            <input type="number" class="form-control" id="uiEditHarga" name="harga" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-primary">Stok Gudang Sekarang</label>
                            <input type="number" class="form-control" id="uiEditStok" name="stok" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ganti Gambar Produk <span class="text-muted small">(Kosongkan jika tidak ingin diubah)</span></label>
                            <input type="file" class="form-control" id="uiEditGambar" name="gambar" accept="image/*">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-warning fw-bold text-dark">Simpan Perubahan</button>
                    </div>
                </form>  
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalEdit;

        document.addEventListener('DOMContentLoaded', async () => {
            modalEdit = new bootstrap.Modal(document.getElementById('modalEditMaster'));
            await cekSession();
            await muatBarang();
        });

        async function cekSession() {
            try {
                const res  = await fetch('auth.php?action=cek_session', { credentials: 'same-origin' });
                const json = await res.json();
                if (json.status === 'success') {
                    document.getElementById('infoUser').textContent = `👤 ${json.data.nama_user} (${json.data.nama_level})`;
                } else { window.location.href = 'login.html'; }
            } catch { window.location.href = 'login.html'; }
        }

        document.getElementById('btnLogout').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('auth.php?action=logout', { credentials: 'same-origin' });
            window.location.href = 'login.html';
        });

        // FUNGSI MEMUAT BARANG KE TABEL
        async function muatBarang() {
            const tbody = document.getElementById('tabelBarang');
            try {
                const res    = await fetch('barang.php', { credentials: 'same-origin' });
                const json   = await res.json();
                const barangs = json.data ?? [];

                if (barangs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-muted py-4">Belum ada data barang.</td></tr>';
                    return;
                }

                tbody.innerHTML = barangs.map((b, i) => {
                    // Jika di database data gambar kosong/null, gunakan placeholder nama produk
                    const imgUrl = b.gambar ? b.gambar : `https://placehold.co/50x50/f8f9fa/007bff?text=${encodeURIComponent(b.nama_produk.substring(0,3))}`;
                    
                    return `
                        <tr>
                            <td>${i + 1}</td>
                            <td class="fw-bold text-secondary">${esc(b.kode_produk ?? '-')}</td>
                            <td>
                                <img src="${imgUrl}" width="50" height="50" class="rounded border shadow-sm" style="object-fit: cover;" onerror="this.src='https://placehold.co/50x50?text=Error'">
                            </td>
                            <td class="fw-bold text-start">${esc(b.nama_produk ?? '')}</td>
                            <td class="fw-bold">${formatRupiah(b.harga)}</td>
                            <td class="fw-bold ${b.stok < 5 ? 'text-danger' : 'text-info'}">${b.stok} Pcs</td>
                            <td>
                                <button class="btn btn-warning btn-sm fw-bold text-dark me-1"
                                    onclick="bukaModalEdit(${b.id}, '${esc(b.kode_produk)}', '${esc(b.nama_produk)}', ${b.harga}, ${b.stok})">
                                    Edit
                                </button>
                                <button class="btn btn-danger btn-sm fw-bold"
                                    onclick="hapusBarang(${b.id}, '${esc(b.nama_produk)}')">
                                    Hapus
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch {
                tbody.innerHTML = '<tr><td colspan="7" class="text-danger">Gagal memuat data dari database.</td></tr>';
            }
        }

        // FUNGSI SUBMIT FORM TAMBAH BARANG 
document.getElementById('formTambah').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnTambah');
    
    // Menggunakan FormData agar file gambar otomatis ikut terkirim
    const formData = new FormData(this);

    btn.disabled = true;
    btn.textContent = 'Menyimpan Berkas...';

    try {
        const res = await fetch('barang.php', {
            method:      'POST',
            credentials: 'same-origin',
            body:        formData // Kirim langsung objek formData
        });
        const json = await res.json();

        if (json.status === 'success') {
            showAlert('Barang dan gambar berhasil disimpan!', 'success');
            this.reset();
            await muatBarang();
        } else {
            showAlert(json.message, 'danger');
        }
    } catch {
        showAlert('Gagal terhubung ke server database.', 'danger');
    } finally {
        btn.disabled    = false;
        btn.textContent = 'Simpan ke Sistem Toko';
    }
});

// FUNGSI SUBMIT FORM EDIT BARANG
function bukaModalEdit(pk, kode, nama, harga, stok) {
    document.getElementById('uiEditPK').value     = pk;
    document.getElementById('uiEditID').value     = kode;
    document.getElementById('uiEditNama').value   = nama;
    document.getElementById('uiEditHarga').value  = harga;
    document.getElementById('uiEditStok').value   = stok;
    
    // Reset input gambar agar tidak membawa file dari editan sebelumnya
    const inputGambar = document.getElementById('uiEditGambar');
    if (inputGambar) inputGambar.value = ''; 
    
    modalEdit.show();
}

document.getElementById('formEdit').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const pk = document.getElementById('uiEditPK').value;
    // Menggunakan FormData agar text dan file gambar biner terbungkus menjadi satu
    const formData = new FormData(this); 

    try {
        const res = await fetch(`barang.php?id=${pk}&action=update`, {
            method:      'POST', 
            credentials: 'same-origin',
            body:        formData 
        });
        
        const json = await res.json();

        if (json.status === 'success') {
            modalEdit.hide();
            showAlert('Detail produk dan gambar berhasil diperbarui!', 'success');
            await muatBarang(); 
            } else { 
            showAlert(json.message, 'danger'); 
            }
        } catch (err) { 
            showAlert('Gagal terhubung ke server backend.', 'danger'); 
        }
    });

        async function hapusBarang(id, nama) {
            if (!confirm(`Yakin ingin menghapus barang "${nama}"?`)) return;
            try {
                const res  = await fetch(`barang.php?id=${id}`, { method: 'DELETE', credentials: 'same-origin' });
                const json = await res.json();
                if (json.status === 'success') {
                    showAlert('Barang berhasil dihapus.', 'success');
                    await muatBarang();
                } else { showAlert(json.message, 'danger'); }
            } catch { showAlert('Gagal terhubung ke server.', 'danger'); }
        }

        function formatRupiah(n) { return 'Rp ' + parseInt(n).toLocaleString('id-ID'); }
        function esc(str) { return String(str ?? '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
        
        function showAlert(msg, type) {
            const el = document.getElementById('alertGlobal');
            el.className   = `alert alert-${type} mb-3`;
            el.textContent = msg;
            setTimeout(() => { el.className = 'alert d-none'; }, 4000);
        }
    </script>
</body>
</html>
